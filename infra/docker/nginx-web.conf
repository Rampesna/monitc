server {
  listen 8080;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;
  server_tokens off;

  add_header X-Content-Type-Options nosniff always;
  add_header X-Frame-Options DENY always;
  add_header Referrer-Policy strict-origin-when-cross-origin always;
  add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
  add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data:; connect-src 'self' __MONITC_API_ORIGIN__ __MONITC_WS_ORIGIN__; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;

  gzip on;
  gzip_types text/plain text/css application/javascript application/json image/svg+xml;

  location = /health {
    access_log off;
    default_type application/json;
    return 200 '{"status":"ok"}';
  }

  location = /api/releases/latest {
    proxy_pass http://api:8080/api/v1/releases/latest;
    proxy_set_header Host $host;
    proxy_set_header X-Request-ID $request_id;
  }

  location /updates/ {
    alias /var/lib/monitc/releases/;
    autoindex off;
    add_header Cache-Control "public, max-age=300";
    add_header X-Content-Type-Options nosniff always;
  }

  location /app/assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
  }

  location /app/ {
    try_files $uri $uri/ /app/index.html;
  }

  location /assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
    try_files $uri =404;
  }

  location / {
    try_files $uri $uri/ /index.html;
  }
}
