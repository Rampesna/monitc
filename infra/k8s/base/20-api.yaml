apiVersion: v1
kind: ServiceAccount
metadata:
  name: api
  namespace: monitc
automountServiceAccountToken: false
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: api
  namespace: monitc
  labels:
    app.kubernetes.io/name: api
    app.kubernetes.io/part-of: monitc
spec:
  replicas: 2
  revisionHistoryLimit: 3
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: api
      app.kubernetes.io/part-of: monitc
  template:
    metadata:
      labels:
        app.kubernetes.io/name: api
        app.kubernetes.io/part-of: monitc
        app.kubernetes.io/component: backend
    spec:
      serviceAccountName: api
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 30
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      initContainers:
        - name: agent-ca-export
          image: busybox:1.37
          imagePullPolicy: IfNotPresent
          command:
            - sh
            - -ec
            - |
              for attempt in $(seq 1 180); do
                if [ -s /pki/ca.crt ]; then
                  install -m 0444 /pki/ca.crt /public/ca.crt
                  exit 0
                fi
                sleep 1
              done
              echo "agent CA was not generated before the startup deadline" >&2
              exit 1
          resources:
            requests:
              cpu: 10m
              memory: 8Mi
            limits:
              cpu: 100m
              memory: 32Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          volumeMounts:
            - name: agent-pki
              mountPath: /pki
              readOnly: true
            - name: agent-ca-public
              mountPath: /public
      containers:
        - name: api
          image: monitc/api:local
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
          envFrom:
            - configMapRef:
                name: monitc-config
            - secretRef:
                name: monitc-secrets
          readinessProbe:
            httpGet:
              path: /health/ready
              port: http
            initialDelaySeconds: 6
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 6
          livenessProbe:
            httpGet:
              path: /health/live
              port: http
            initialDelaySeconds: 20
            periodSeconds: 10
            timeoutSeconds: 3
          lifecycle:
            preStop:
              exec:
                command: [sh, -c, "sleep 5"]
          resources:
            requests:
              cpu: 150m
              memory: 256Mi
            limits:
              cpu: "2"
              memory: 1Gi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          volumeMounts:
            - name: releases
              mountPath: /var/lib/monitc/releases
            - name: tmp
              mountPath: /tmp
            - name: agent-ca-public
              mountPath: /var/run/monitc-agent-ca
              readOnly: true
      volumes:
        - name: releases
          persistentVolumeClaim:
            claimName: releases
        - name: tmp
          emptyDir:
            sizeLimit: 512Mi
        - name: agent-pki
          persistentVolumeClaim:
            claimName: agent-pki
        - name: agent-ca-public
          emptyDir:
            sizeLimit: 1Mi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: worker
  namespace: monitc
  labels:
    app.kubernetes.io/name: worker
    app.kubernetes.io/part-of: monitc
spec:
  replicas: 1
  revisionHistoryLimit: 3
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: worker
      app.kubernetes.io/part-of: monitc
  template:
    metadata:
      labels:
        app.kubernetes.io/name: worker
        app.kubernetes.io/part-of: monitc
        app.kubernetes.io/component: collector
    spec:
      serviceAccountName: api
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 45
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: worker
          image: monitc/api:local
          imagePullPolicy: IfNotPresent
          command: [node, apps/api/dist/worker.js]
          envFrom:
            - configMapRef:
                name: monitc-config
            - secretRef:
                name: monitc-secrets
          resources:
            requests:
              cpu: 150m
              memory: 192Mi
            limits:
              cpu: "2"
              memory: 1Gi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir:
            sizeLimit: 128Mi
---
apiVersion: v1
kind: Service
metadata:
  name: api
  namespace: monitc
  labels:
    app.kubernetes.io/name: api
    app.kubernetes.io/part-of: monitc
spec:
  type: NodePort
  selector:
    app.kubernetes.io/name: api
    app.kubernetes.io/part-of: monitc
  ports:
    - name: http
      port: 8080
      targetPort: http
      nodePort: 9128
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: api
  namespace: monitc
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: api
      app.kubernetes.io/part-of: monitc
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: api
  namespace: monitc
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: api
  minReplicas: 2
  maxReplicas: 6
  behavior:
    scaleDown:
      stabilizationWindowSeconds: 300
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
