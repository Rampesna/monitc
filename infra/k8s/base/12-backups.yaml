apiVersion: batch/v1
kind: CronJob
metadata:
  name: postgres-backup
  namespace: monitc
  labels:
    app.kubernetes.io/name: backup
    app.kubernetes.io/part-of: monitc
spec:
  schedule: "15 2 * * *"
  timeZone: Europe/Istanbul
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 3
      ttlSecondsAfterFinished: 86400
      template:
        metadata:
          labels:
            app.kubernetes.io/name: backup
            app.kubernetes.io/part-of: monitc
        spec:
          restartPolicy: OnFailure
          automountServiceAccountToken: false
          securityContext:
            runAsNonRoot: true
            runAsUser: 999
            runAsGroup: 999
            fsGroup: 999
            seccompProfile:
              type: RuntimeDefault
          containers:
            - name: pg-dump
              image: pgvector/pgvector:pg16
              imagePullPolicy: IfNotPresent
              command: [sh, -ec]
              args:
                - |
                  umask 077
                  target="/backups/monitc-$(date -u +%Y%m%dT%H%M%SZ).dump"
                  pg_dump --format=custom --no-owner --no-acl --file="$target"
                  find /backups -type f -name 'monitc-*.dump' -mtime +14 -delete
                  pg_restore --list "$target" >/dev/null
              env:
                - name: PGHOST
                  value: postgres
                - name: PGPORT
                  value: "5432"
                - name: PGUSER
                  valueFrom:
                    secretKeyRef:
                      name: monitc-secrets
                      key: POSTGRES_USER
                - name: PGPASSWORD
                  valueFrom:
                    secretKeyRef:
                      name: monitc-secrets
                      key: POSTGRES_PASSWORD
                - name: PGDATABASE
                  valueFrom:
                    secretKeyRef:
                      name: monitc-secrets
                      key: POSTGRES_DB
              resources:
                requests:
                  cpu: 50m
                  memory: 96Mi
                limits:
                  cpu: "1"
                  memory: 512Mi
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities:
                  drop: [ALL]
              volumeMounts:
                - name: backups
                  mountPath: /backups
                - name: tmp
                  mountPath: /tmp
          volumes:
            - name: backups
              hostPath:
                path: /www/wwwroot/monitc/runtime/backups
                type: DirectoryOrCreate
            - name: tmp
              emptyDir:
                sizeLimit: 256Mi
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: backup-egress
  namespace: monitc
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: backup
  policyTypes: [Egress]
  egress:
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: postgres
      ports:
        - protocol: TCP
          port: 5432
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
