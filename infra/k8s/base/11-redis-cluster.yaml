apiVersion: v1
kind: Service
metadata:
  name: redis-headless
  namespace: monitc
  labels:
    app.kubernetes.io/name: redis
    app.kubernetes.io/part-of: monitc
spec:
  clusterIP: None
  publishNotReadyAddresses: true
  selector:
    app.kubernetes.io/name: redis
    app.kubernetes.io/part-of: monitc
  ports:
    - name: client
      port: 6379
      targetPort: client
    - name: gossip
      port: 16379
      targetPort: gossip
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: redis
  namespace: monitc
  labels:
    app.kubernetes.io/name: redis
    app.kubernetes.io/part-of: monitc
spec:
  serviceName: redis-headless
  replicas: 3
  podManagementPolicy: Parallel
  selector:
    matchLabels:
      app.kubernetes.io/name: redis
      app.kubernetes.io/part-of: monitc
  template:
    metadata:
      labels:
        app.kubernetes.io/name: redis
        app.kubernetes.io/part-of: monitc
        app.kubernetes.io/component: cache
    spec:
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 30
      securityContext:
        fsGroup: 999
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: redis
          image: redis:7.4-alpine
          imagePullPolicy: IfNotPresent
          command: [sh, -ec]
          args:
            - |
              pod_ip="$(hostname -i | awk '{print $1}')"
              pod_hostname="$HOSTNAME.redis-headless.monitc.svc.cluster.local"
              exec redis-server \
                --port 6379 \
                --cluster-enabled yes \
                --cluster-config-file /data/nodes.conf \
                --cluster-node-timeout 5000 \
                --cluster-announce-ip "$pod_ip" \
                --cluster-announce-hostname "$pod_hostname" \
                --cluster-preferred-endpoint-type hostname \
                --appendonly yes \
                --appendfsync everysec \
                --protected-mode no \
                --bind 0.0.0.0 \
                --requirepass "$REDIS_PASSWORD" \
                --masterauth "$REDIS_PASSWORD"
          env:
            - name: REDIS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: monitc-secrets
                  key: REDIS_PASSWORD
          ports:
            - name: client
              containerPort: 6379
            - name: gossip
              containerPort: 16379
          readinessProbe:
            exec:
              command: [sh, -ec, "redis-cli -a \"$REDIS_PASSWORD\" --no-auth-warning ping | grep PONG"]
            initialDelaySeconds: 4
            periodSeconds: 5
            timeoutSeconds: 3
          livenessProbe:
            exec:
              command: [sh, -ec, "redis-cli -a \"$REDIS_PASSWORD\" --no-auth-warning ping | grep PONG"]
            initialDelaySeconds: 20
            periodSeconds: 10
            timeoutSeconds: 3
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: "1"
              memory: 1Gi
          securityContext:
            runAsUser: 999
            runAsGroup: 999
            runAsNonRoot: true
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
          volumeMounts:
            - name: data
              mountPath: /data
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: [ReadWriteOnce]
        storageClassName: local-path
        resources:
          requests:
            storage: 2Gi
---
apiVersion: batch/v1
kind: Job
metadata:
  name: redis-cluster-bootstrap
  namespace: monitc
  labels:
    app.kubernetes.io/name: redis-bootstrap
    app.kubernetes.io/part-of: monitc
spec:
  backoffLimit: 8
  ttlSecondsAfterFinished: 86400
  template:
    metadata:
      labels:
        app.kubernetes.io/name: redis-bootstrap
        app.kubernetes.io/part-of: monitc
    spec:
      automountServiceAccountToken: false
      restartPolicy: OnFailure
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: bootstrap
          image: redis:7.4-alpine
          imagePullPolicy: IfNotPresent
          command: [sh, -ec]
          args:
            - |
              for node in redis-0 redis-1 redis-2; do
                until redis-cli -h "$node.redis-headless" -a "$REDIS_PASSWORD" --no-auth-warning ping | grep -q PONG; do
                  sleep 2
                done
              done
              if redis-cli -h redis-0.redis-headless -a "$REDIS_PASSWORD" --no-auth-warning cluster info 2>/dev/null | grep -q 'cluster_state:ok'; then
                exit 0
              fi
              redis-cli -a "$REDIS_PASSWORD" --no-auth-warning --cluster create \
                redis-0.redis-headless:6379 \
                redis-1.redis-headless:6379 \
                redis-2.redis-headless:6379 \
                --cluster-replicas 0 \
                --cluster-yes
          env:
            - name: REDIS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: monitc-secrets
                  key: REDIS_PASSWORD
          resources:
            requests:
              cpu: 25m
              memory: 32Mi
            limits:
              cpu: 200m
              memory: 128Mi
          securityContext:
            runAsNonRoot: true
            runAsUser: 999
            runAsGroup: 999
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
