apiVersion: v1
kind: ConfigMap
metadata:
  name: monitc-config
  namespace: monitc
data:
  NODE_ENV: production
  PORT: "8080"
  LOG_LEVEL: info
  TRUST_PROXY: "true"
  APP_ORIGIN: https://monitc.talhacan.com
  ADMIN_ORIGIN: https://monitcap.talhacan.com
  API_ORIGIN: https://monitc-api.talhacan.com
  JWT_KEY_ID: monitc-2026-01
  JWT_ISSUER: https://monitc-api.talhacan.com
  JWT_AUDIENCE: monitc-platform
  ACCESS_TOKEN_TTL_SECONDS: "600"
  REFRESH_TOKEN_TTL_DAYS: "30"
  VAULT_KEY_ID: vault-2026-01
  COOKIE_DOMAIN: ""
  RELEASES_PATH: /var/lib/monitc/releases
  WORKER_POLL_SECONDS: "30"
  ALLOW_PRIVATE_TARGETS: "false"
  REDIS_MODE: cluster
  REDIS_NODES: redis-0.redis-headless:6379,redis-1.redis-headless:6379,redis-2.redis-headless:6379
  AGENT_GATEWAY_PUBLIC_ADDRESS: monitc-agent.talhacan.com:443
  AGENT_GATEWAY_SERVER_NAME: monitc-agent.talhacan.com
  AGENT_INSTALL_URL: https://monitc.talhacan.com/install-agent.sh
  AGENT_CA_CERT_PATH: /var/run/monitc-agent-ca/ca.crt
  PASSKEY_RP_ID: monitc.talhacan.com
  PASSKEY_RP_NAME: Monitc
  PASSKEY_ORIGINS: https://monitc.talhacan.com
  APPLE_BUNDLE_ID: com.monitc.mobile
  APPLE_APP_ID: "6797095612"
  GOOGLE_CLIENT_IDS: 456060310934-iukkcf8rm22a6pad2nvk27jp8mvg0jkc.apps.googleusercontent.com,456060310934-759e8ga0nr4u7ldut528fuuq9qvkq4mg.apps.googleusercontent.com
  # Isolated synthetic workspace used by App Store reviewers; workload actions never reach real infrastructure.
  APP_REVIEW_WORKSPACE_ID: "6c0d399d-293e-41ea-9a32-60b0a1e34196"
  # Public Apple Root CA G2/G3 certificates used to verify StoreKit JWS chains.
  APPLE_ROOT_CA_B64: ","
  MONITC_AGENT_GATEWAY_LISTEN: :9443
  MONITC_AGENT_GATEWAY_STATE_DIR: /var/lib/monitc/agent-pki
  MONITC_AGENT_CA_CERT: /var/lib/monitc/agent-pki/ca.crt
  MONITC_AGENT_CA_KEY: /var/lib/monitc/agent-pki/ca.key
  MONITC_AGENT_SERVER_CERT: /var/lib/monitc/agent-pki/server.crt
  MONITC_AGENT_SERVER_KEY: /var/lib/monitc/agent-pki/server.key
  MONITC_AGENT_SERVER_NAMES: monitc-agent.talhacan.com
  MONITC_AGENT_TRUST_DOMAIN: monitc.talhacan.com
  MONITC_AGENT_CERT_TTL: 168h
  MONITC_AGENT_SAMPLE_INTERVAL: 1s
  # Acts as the delivery floor. The gateway takes max(plan sample interval, this value),
  # so Community remains at 5s while Scale can deliver every 250ms.
  MONITC_AGENT_BATCH_INTERVAL: 250ms
  MONITC_AGENT_HEARTBEAT_INTERVAL: 15s
