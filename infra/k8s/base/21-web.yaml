apiVersion: apps/v1
kind: Deployment
metadata:
  name: web
  namespace: monitc
  labels:
    app.kubernetes.io/name: web
    app.kubernetes.io/part-of: monitc
spec:
  replicas: 2
  revisionHistoryLimit: 3
  selector:
    matchLabels:
      app.kubernetes.io/name: web
      app.kubernetes.io/part-of: monitc
  template:
    metadata:
      labels:
        app.kubernetes.io/name: web
        app.kubernetes.io/part-of: monitc
        app.kubernetes.io/component: frontend
    spec:
      terminationGracePeriodSeconds: 20
      securityContext:
        runAsNonRoot: true
        runAsUser: 101
        runAsGroup: 101
        fsGroup: 101
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: web
          image: monitc/web:local
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 3
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 15
            periodSeconds: 10
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 500m
              memory: 256Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          volumeMounts:
            - name: releases
              mountPath: /var/lib/monitc/releases
              readOnly: true
            - name: nginx-cache
              mountPath: /var/cache/nginx
            - name: nginx-run
              mountPath: /var/run
            - name: nginx-tmp
              mountPath: /tmp
      volumes:
        - name: releases
          hostPath:
            path: /www/wwwroot/monitc/runtime/releases
            type: DirectoryOrCreate
        - name: nginx-cache
          emptyDir:
            sizeLimit: 64Mi
        - name: nginx-run
          emptyDir:
            sizeLimit: 8Mi
        - name: nginx-tmp
          emptyDir:
            sizeLimit: 32Mi
---
apiVersion: v1
kind: Service
metadata:
  name: web
  namespace: monitc
  labels:
    app.kubernetes.io/name: web
    app.kubernetes.io/part-of: monitc
spec:
  type: NodePort
  selector:
    app.kubernetes.io/name: web
    app.kubernetes.io/part-of: monitc
  ports:
    - name: http
      port: 8080
      targetPort: http
      nodePort: 9127
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: web
  namespace: monitc
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: web
      app.kubernetes.io/part-of: monitc
