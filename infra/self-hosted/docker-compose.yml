name: monitc

services:
  postgres:
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      PGDATA: /var/lib/postgresql/data/pgdata
    command:
      - postgres
      - -c
      - password_encryption=scram-sha-256
      - -c
      - shared_buffers=256MB
      - -c
      - log_min_duration_statement=1000
    healthcheck:
      test: [CMD-SHELL, "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 5s
      timeout: 3s
      retries: 20
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks: [data]
    security_opt: [no-new-privileges:true]

  redis:
    image: redis:7.4-alpine
    restart: unless-stopped
    command:
      - sh
      - -ec
      - exec redis-server --appendonly yes --appendfsync everysec --requirepass "$$REDIS_PASSWORD"
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD}
    healthcheck:
      test: [CMD-SHELL, "redis-cli -a \"$${REDIS_PASSWORD}\" --no-auth-warning ping | grep PONG"]
      interval: 5s
      timeout: 3s
      retries: 20
    volumes:
      - redis-data:/data
    networks: [data]
    security_opt: [no-new-privileges:true]

  api:
    image: monitc-api:local
    build:
      context: ../..
      dockerfile: infra/docker/api.Dockerfile
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      REDIS_MODE: standalone
      REDIS_NODES: redis:6379
      RELEASES_PATH: /var/lib/monitc/releases
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: [CMD, node, -e, "fetch('http://127.0.0.1:8080/health/ready').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 4s
      retries: 12
    ports:
      - ${BIND_ADDRESS:-127.0.0.1}:${API_PORT:-9128}:8080
    volumes:
      - releases:/var/lib/monitc/releases
    networks: [edge, data]
    read_only: true
    tmpfs:
      - /tmp:size=256m,mode=1777
    security_opt: [no-new-privileges:true]

  worker:
    image: monitc-api:local
    restart: unless-stopped
    command: [node, apps/api/dist/worker.js]
    env_file: .env
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      REDIS_MODE: standalone
      REDIS_NODES: redis:6379
    depends_on:
      api:
        condition: service_healthy
    networks: [edge, data]
    read_only: true
    tmpfs:
      - /tmp:size=128m,mode=1777
    security_opt: [no-new-privileges:true]

  web:
    image: monitc-web:local
    build:
      context: ../..
      dockerfile: infra/docker/web.Dockerfile
      args:
        VITE_API_URL: ${API_ORIGIN}
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    ports:
      - ${BIND_ADDRESS:-127.0.0.1}:${WEB_PORT:-9127}:8080
    volumes:
      - releases:/var/lib/monitc/releases:ro
    networks: [edge]
    read_only: true
    tmpfs:
      - /var/cache/nginx:size=64m,uid=101,gid=101
      - /var/run:size=8m,uid=101,gid=101
      - /tmp:size=32m,uid=101,gid=101
    security_opt: [no-new-privileges:true]

  admin:
    image: monitc-admin:local
    build:
      context: ../..
      dockerfile: infra/docker/admin.Dockerfile
      args:
        VITE_API_URL: ${API_ORIGIN}
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    ports:
      - ${BIND_ADDRESS:-127.0.0.1}:${ADMIN_PORT:-9129}:8080
    networks: [edge]
    read_only: true
    tmpfs:
      - /var/cache/nginx:size=64m,uid=101,gid=101
      - /var/run:size=8m,uid=101,gid=101
      - /tmp:size=32m,uid=101,gid=101
    security_opt: [no-new-privileges:true]

  backup:
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    env_file: .env
    environment:
      PGHOST: postgres
      PGPORT: 5432
      PGUSER: ${POSTGRES_USER}
      PGPASSWORD: ${POSTGRES_PASSWORD}
      PGDATABASE: ${POSTGRES_DB}
    command:
      - sh
      - -ec
      - |
        umask 077
        while true; do
          target="/backups/monitc-$$(date -u +%Y%m%dT%H%M%SZ).dump"
          pg_dump --format=custom --no-owner --no-acl --file="$$target"
          pg_restore --list "$$target" >/dev/null
          find /backups -type f -name 'monitc-*.dump' -mtime +14 -delete
          sleep 86400
        done
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - backups:/backups
    networks: [data]
    read_only: true
    tmpfs:
      - /tmp:size=256m,mode=1777
    security_opt: [no-new-privileges:true]

networks:
  edge:
  data:
    internal: true

volumes:
  postgres-data:
  redis-data:
  releases:
  backups:
