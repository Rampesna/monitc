name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    name: Validate release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v7
        with:
          node-version: 22.22.0
          cache: npm

      - name: Require tag commit on main
        shell: bash
        run: |
          git fetch origin main
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main || {
            echo "Release tags must point to a commit on main."
            exit 1
          }

      - name: Validate version and updater configuration
        run: node scripts/verify-release.mjs "${{ github.ref_name }}"

      - name: Install dependencies
        run: npm ci

      - name: Build application
        run: npm run build

  macos:
    name: Build signed macOS update
    needs: validate
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22.22.0
          cache: npm

      - name: Verify macOS signing secrets
        shell: bash
        env:
          MAC_CSC_LINK: ${{ secrets.MAC_CSC_LINK }}
          MAC_CSC_KEY_PASSWORD: ${{ secrets.MAC_CSC_KEY_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          missing=0
          for name in MAC_CSC_LINK MAC_CSC_KEY_PASSWORD APPLE_ID APPLE_APP_SPECIFIC_PASSWORD APPLE_TEAM_ID; do
            if [ -z "${!name}" ]; then
              echo "Missing required GitHub secret: $name"
              missing=1
            fi
          done
          exit "$missing"

      - name: Install dependencies
        run: npm ci

      - name: Build renderer and main process
        run: npm run build

      - name: Package, sign, and notarize
        run: npx electron-builder --mac --publish never -c.forceCodeSigning=true
        env:
          CSC_LINK: ${{ secrets.MAC_CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.MAC_CSC_KEY_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}

      - name: Upload macOS release assets
        uses: actions/upload-artifact@v4
        with:
          name: release-macos
          if-no-files-found: error
          retention-days: 7
          path: |
            dist/*.dmg
            dist/*.zip
            dist/*.blockmap
            dist/latest-mac.yml

  windows:
    name: Build Windows update
    needs: validate
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22.22.0
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build renderer and main process
        run: npm run build

      - name: Package Windows update
        run: npx electron-builder --win --x64 --publish never
        env:
          WIN_CSC_LINK: ${{ secrets.WIN_CSC_LINK }}
          WIN_CSC_KEY_PASSWORD: ${{ secrets.WIN_CSC_KEY_PASSWORD }}

      - name: Upload Windows release assets
        uses: actions/upload-artifact@v4
        with:
          name: release-windows
          if-no-files-found: error
          retention-days: 7
          path: |
            dist/*.exe
            dist/*.blockmap
            dist/latest.yml

  linux:
    name: Build Linux update
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22.22.0
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build renderer and main process
        run: npm run build

      - name: Package Linux update
        run: npx electron-builder --linux --x64 --publish never

      - name: Upload Linux release assets
        uses: actions/upload-artifact@v4
        with:
          name: release-linux
          if-no-files-found: error
          retention-days: 7
          path: |
            dist/*.AppImage
            dist/*.deb
            dist/*.blockmap
            dist/latest-linux.yml

  agent:
    name: Build Linux native agent
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v6
        with:
          go-version: '1.25.12'
          cache-dependency-path: agent/go.sum

      - name: Test and build native agent
        shell: bash
        run: |
          version="${GITHUB_REF_NAME#v}"
          mkdir -p agent-dist
          (
            cd agent
            go test ./...
            for arch in amd64 arm64; do
              GOOS=linux GOARCH="$arch" CGO_ENABLED=0 \
                go build -trimpath -ldflags "-s -w -X main.version=$version" \
                -o "../agent-dist/monitc-agent-linux-$arch" ./cmd/monitc-agent
            done
          )
          cp agent/packaging/systemd/monitc-agent.service agent-dist/
          (
            cd agent-dist
            for binary in monitc-agent-linux-*; do
              sha256sum "$binary" > "$binary.sha256"
            done
          )

      - name: Upload native agent release assets
        uses: actions/upload-artifact@v4
        with:
          name: release-agent
          if-no-files-found: error
          retention-days: 7
          path: agent-dist/*

  publish:
    name: Publish GitHub release
    needs: [macos, windows, linux, agent]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v4
        with:
          pattern: release-*
          path: release-assets
          merge-multiple: true

      - name: Verify updater metadata and packages
        run: node scripts/verify-update-artifacts.mjs release-assets

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          draft: false
          prerelease: ${{ contains(github.ref_name, '-') }}
          generate_release_notes: true
          make_latest: ${{ contains(github.ref_name, '-') && 'false' || 'true' }}
          fail_on_unmatched_files: true
          files: release-assets/*

  deploy-update-feed:
    name: Deploy update feed
    needs: publish
    if: ${{ !contains(github.ref_name, '-') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: release-*
          path: release-assets
          merge-multiple: true

      - name: Create public release metadata
        shell: bash
        run: |
          version="${GITHUB_REF_NAME#v}"
          download_file="$(find release-assets -maxdepth 1 -type f -name '*.dmg' -printf '%f\n' | head -n 1)"
          if [ -z "$download_file" ]; then
            download_file="$(find release-assets -maxdepth 1 -type f \( -name '*.zip' -o -name '*.exe' -o -name '*.AppImage' \) -printf '%f\n' | head -n 1)"
          fi
          VERSION="$version" DOWNLOAD_FILE="$download_file" node --input-type=module <<'NODE'
          import { writeFile } from 'node:fs/promises'
          const metadata = {
            version: process.env.VERSION,
            summary: `monitc ${process.env.VERSION} is ready.`,
            publishedAt: new Date().toISOString(),
            downloadUrl: process.env.DOWNLOAD_FILE
              ? `https://monitc.talhacan.com/updates/${encodeURIComponent(process.env.DOWNLOAD_FILE)}`
              : 'https://github.com/Rampesna/monitc/releases/latest'
          }
          await writeFile('release-assets/release.json', `${JSON.stringify(metadata, null, 2)}\n`)
          NODE
          mkdir -p "release-assets/agent/${GITHUB_REF_NAME}"
          for agent_asset in \
            release-assets/monitc-agent-linux-* \
            release-assets/monitc-agent.service; do
            [ -f "$agent_asset" ] || continue
            mv "$agent_asset" "release-assets/agent/${GITHUB_REF_NAME}/"
          done
          printf '%s\n' "$GITHUB_REF_NAME" > release-assets/agent/latest.txt

      - name: Configure pinned SSH identity
        shell: bash
        env:
          DEPLOY_KEY: ${{ secrets.MONITC_DEPLOY_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.MONITC_DEPLOY_KNOWN_HOSTS }}
        run: |
          install -d -m 700 "$HOME/.ssh"
          install -m 600 /dev/null "$HOME/.ssh/id_ed25519"
          install -m 600 /dev/null "$HOME/.ssh/known_hosts"
          printf '%s\n' "$DEPLOY_KEY" > "$HOME/.ssh/id_ed25519"
          printf '%s\n' "$KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"

      - name: Upload verified release to monitc update feed
        shell: bash
        env:
          DEPLOY_HOST: ${{ secrets.MONITC_DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.MONITC_DEPLOY_USER }}
        run: |
          staging="/www/wwwroot/monitc/runtime/releases/.incoming-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          ssh -o BatchMode=yes -o StrictHostKeyChecking=yes \
            "$DEPLOY_USER@$DEPLOY_HOST" "install -d -m 770 '$staging'"
          rsync -az --checksum --chmod=F644,D755 \
            -e "ssh -o BatchMode=yes -o StrictHostKeyChecking=yes" \
            release-assets/ "$DEPLOY_USER@$DEPLOY_HOST:$staging/"
          ssh -o BatchMode=yes -o StrictHostKeyChecking=yes \
            "$DEPLOY_USER@$DEPLOY_HOST" \
            "rsync -a --checksum '$staging/' /www/wwwroot/monitc/runtime/releases/ && rm -rf -- '$staging' && /www/wwwroot/monitc/infra/scripts/sync-releases.sh"
